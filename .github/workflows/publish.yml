name: Publish to npm (OIDC trusted publishing)

# Publishes @koove/secrets-cli on a GitHub Release. No npm token: npm trusts
# this exact repo+workflow via OIDC (Trusted Publishing) and attaches a
# provenance attestation. One-time setup: npmjs.com -> @koove/secrets-cli ->
# Settings -> Trusted Publisher (repo kooveio/koove-secrets-cli, publish.yml).
#
# Release flow: bump version -> commit -> draft a GitHub Release vX.Y.Z -> Publish.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED: lets npm verify this workflow via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --provenance --access public
